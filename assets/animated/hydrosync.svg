<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="HydroSync Studio: Overlapping gauge exports → one clean hourly dataset">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b111d"/><stop offset="1" stop-color="#0f1726"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#fff" fill-opacity="0.09"/>
    </pattern>
    <radialGradient id="glowR" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeMaskGrad" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="320">
      <rect width="1280" height="320" fill="url(#fadeMaskGrad)"/>
    </mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
  .fade-in{animation:fadeIn 1s ease-out both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes shimmer{from{transform:translateX(-400px)}to{transform:translateX(1700px)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

      .bar-shine{animation:shimmer 5s ease-in-out infinite}
      .icon-pulse{animation:pulse 3s ease-in-out infinite}
      .exp{animation:slide 7s ease-in-out infinite;opacity:0}
      @keyframes slide{0%{opacity:0;transform:translateX(80px)}12%,80%{opacity:1;transform:none}100%{opacity:0}}
      .arr{animation:drop 7s ease-in-out infinite;opacity:0}
      @keyframes drop{0%,20%{opacity:0;transform:translateY(-10px)}35%,80%{opacity:1;transform:none}100%{opacity:0}}
      .merged{animation:pulse 3.5s ease-in-out infinite}
      .wave{animation:wv 4s linear infinite}
      @keyframes wv{to{transform:translateX(-160px)}}
    </style>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glowR)"/>

  <g mask="url(#fadeMask)">
    <g class="exp" style="animation-delay:0.00s"><rect x="850" y="58" width="180" height="18" rx="9" fill="#38bdf8" fill-opacity="0.30"/><text x="1022" y="71" text-anchor="end" class="mono" font-size="11" fill="#e0f2fe">export 1 · 72 h</text></g><g class="exp" style="animation-delay:0.35s"><rect x="902" y="82" width="180" height="18" rx="9" fill="#38bdf8" fill-opacity="0.42"/><text x="1074" y="95" text-anchor="end" class="mono" font-size="11" fill="#e0f2fe">export 2 · 72 h</text></g><g class="exp" style="animation-delay:0.70s"><rect x="954" y="106" width="180" height="18" rx="9" fill="#38bdf8" fill-opacity="0.54"/><text x="1126" y="119" text-anchor="end" class="mono" font-size="11" fill="#e0f2fe">export 3 · 72 h</text></g><g class="exp" style="animation-delay:1.05s"><rect x="1006" y="130" width="180" height="18" rx="9" fill="#38bdf8" fill-opacity="0.66"/><text x="1178" y="143" text-anchor="end" class="mono" font-size="11" fill="#e0f2fe">export 4 · 72 h</text></g><g class="exp" style="animation-delay:1.40s"><rect x="1058" y="154" width="180" height="18" rx="9" fill="#38bdf8" fill-opacity="0.78"/><text x="1230" y="167" text-anchor="end" class="mono" font-size="11" fill="#e0f2fe">export 5 · 72 h</text></g>
    <g class="arr" style="animation-delay:1.80s"><path d="M920 188 v26 m-7 -8 l7 8 l7 -8" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"/></g><g class="arr" style="animation-delay:2.05s"><path d="M1040 188 v26 m-7 -8 l7 8 l7 -8" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"/></g><g class="arr" style="animation-delay:2.30s"><path d="M1160 188 v26 m-7 -8 l7 8 l7 -8" fill="none" stroke="#22c55e" stroke-width="2.4" stroke-linecap="round"/></g>
    <rect x="800" y="226" width="440" height="12" rx="6" fill="#22c55e" class="merged"/>
    <text x="1240" y="258" text-anchor="end" class="mono" font-size="11" fill="#86efac">1 row / hour / station</text>
    <path d="M700 290 q40.0 -9 80.0 0 t80.0 0 q40.0 -9 80.0 0 t80.0 0 q40.0 -9 80.0 0 t80.0 0 q40.0 -9 80.0 0 t80.0 0 q40.0 -9 80.0 0 t80.0 0 q40.0 -9 80.0 0 t80.0 0" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="2" class="wave"/>
  </g>

  <g class="fade-in">
    <rect x="60" y="112" width="100" height="100" rx="22" fill="#38bdf8" fill-opacity="0.10" stroke="#38bdf8" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="60" y="112" width="100" height="100" rx="22" fill="none" stroke="#38bdf8" stroke-width="2" class="icon-pulse" filter="url(#soft)"/>
    <g transform="translate(110 162)" fill="none" stroke="#38bdf8" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-24 -6 A26 26 0 0 1 22 -14 M22 -14 L24 -26 M22 -14 L10 -14"/><path d="M24 6 A26 26 0 0 1 -22 14 M-22 14 L-24 26 M-22 14 L-10 14"/><circle cx="0" cy="0" r="5" fill="currentColor"/></g>
    <text x="188" y="164" class="sans" font-size="50" font-weight="700" fill="#f1f5f9">HydroSync Studio</text>
    <text x="190" y="198" class="sans" font-size="19" fill="#94a3b8">Overlapping gauge exports → one clean hourly dataset</text>
    <rect x="190.0" y="214" width="104.6" height="26" rx="13" fill="#1e293b" stroke="#94a3b8" stroke-opacity="0.28"/><text x="242.3" y="231.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#cbd5e1">FloodLink 2.0</text><rect x="302.6" y="214" width="72.7" height="26" rx="13" fill="#1e293b" stroke="#94a3b8" stroke-opacity="0.28"/><text x="339.0" y="231.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#cbd5e1">PySide6</text><rect x="383.3" y="214" width="68.4" height="26" rx="13" fill="#1e293b" stroke="#94a3b8" stroke-opacity="0.28"/><text x="417.5" y="231.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#cbd5e1">pandas</text><rect x="459.7" y="214" width="107.6" height="26" rx="13" fill="#1e293b" stroke="#94a3b8" stroke-opacity="0.28"/><text x="513.5" y="231.5" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#cbd5e1">Windows .exe</text>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="url(#bar)"/>
  <rect x="0" y="316" width="260" height="4" fill="url(#shine)" class="bar-shine" opacity="0.7"/>
</svg>
