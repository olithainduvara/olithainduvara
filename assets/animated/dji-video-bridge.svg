<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Drone Video Bridge: Live drone camera feed on HDMI, straight from the remote">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b111d"/><stop offset="1" stop-color="#0f1726"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#fff" fill-opacity="0.09"/>
    </pattern>
    <radialGradient id="glowR" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.16"/><stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeMaskGrad" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="320">
      <rect width="1280" height="320" fill="url(#fadeMaskGrad)"/>
    </mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
  .fade-in{animation:fadeIn 1s ease-out both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes shimmer{from{transform:translateX(-400px)}to{transform:translateX(1700px)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

      .bar-shine{animation:shimmer 5s ease-in-out infinite}
      .icon-pulse{animation:pulse 3s ease-in-out infinite}
      .flow{animation:dash 1.1s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-24}}
      .rec{animation:pulse 1.4s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glowR)"/>

  <g mask="url(#fadeMask)">
    <g transform="translate(760 120)">
      <rect x="-52" y="-28" width="104" height="56" rx="26" fill="#1f2937" stroke="#64748b" stroke-width="1.5"/>
      <circle cx="-25" cy="0" r="12" fill="#0f172a" stroke="#64748b"/><circle cx="-25" cy="0" r="5" fill="#94a3b8"/>
      <circle cx="25" cy="0" r="12" fill="#0f172a" stroke="#64748b"/><circle cx="25" cy="0" r="5" fill="#94a3b8"/>
    </g>
    <g transform="translate(960 120)">
      <rect x="-58" y="-38" width="116" height="76" rx="7" fill="#14532d" stroke="#22c55e" stroke-opacity="0.6" stroke-width="1.5"/>
      <rect x="-18" y="-14" width="30" height="30" rx="3" fill="#cbd5e1"/>
      <rect x="20" y="-12" width="20" height="16" rx="2" fill="#1f2937"/>
      <g fill="#facc15" fill-opacity="0.85"><rect x="-50" y="-34" width="3.5" height="5" rx="1"/><rect x="-43" y="-34" width="3.5" height="5" rx="1"/><rect x="-36" y="-34" width="3.5" height="5" rx="1"/><rect x="-29" y="-34" width="3.5" height="5" rx="1"/><rect x="-22" y="-34" width="3.5" height="5" rx="1"/><rect x="-15" y="-34" width="3.5" height="5" rx="1"/><rect x="-8" y="-34" width="3.5" height="5" rx="1"/><rect x="-1" y="-34" width="3.5" height="5" rx="1"/><rect x="6" y="-34" width="3.5" height="5" rx="1"/><rect x="13" y="-34" width="3.5" height="5" rx="1"/><rect x="20" y="-34" width="3.5" height="5" rx="1"/><rect x="27" y="-34" width="3.5" height="5" rx="1"/><rect x="34" y="-34" width="3.5" height="5" rx="1"/><rect x="41" y="-34" width="3.5" height="5" rx="1"/></g>
    </g>
    <g transform="translate(1160 120)">
      <rect x="-30" y="-54" width="60" height="108" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.5"/>
      <rect x="-25" y="-46" width="50" height="88" rx="5" fill="#1e3a5f"/>
      <path d="M-25 24 L-8 4 L4 16 L12 8 L25 20 V42 H-25 Z" fill="#14532d" fill-opacity="0.8"/>
    </g>
    <g transform="translate(960 252)">
      <rect x="-86" y="-40" width="172" height="80" rx="7" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.7" stroke-width="1.5"/>
      <rect x="-79" y="-33" width="158" height="66" rx="4" fill="#1e3a5f"/>
      <path d="M-79 20 L-48 -2 L-24 12 L4 -10 L40 14 L79 -2 V33 H-79 Z" fill="#14532d" fill-opacity="0.8"/>
      <rect x="-72" y="-27" width="34" height="12" rx="3" fill="#ef4444" class="rec"/>
      <text x="-55" y="-18" text-anchor="middle" class="sans" font-size="8.5" font-weight="800" fill="#fff">LIVE</text>
    </g>
    <g fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10">
      <path d="M814 120 H900" stroke="#fb7185" class="flow"/>
      <path d="M1020 120 H1128" stroke="#fb7185" class="flow"/>
      <path d="M960 160 V210" stroke="#7dd3fc" class="flow"/>
    </g>
  </g>

  <g class="fade-in">
    <rect x="60" y="112" width="100" height="100" rx="22" fill="#fb7185" fill-opacity="0.10" stroke="#fb7185" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="60" y="112" width="100" height="100" rx="22" fill="none" stroke="#fb7185" stroke-width="2" class="icon-pulse" filter="url(#soft)"/>
    <g transform="translate(110 162)" fill="none" stroke="#fb7185" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-28" y="-20" width="56" height="34" rx="4"/><path d="M-12 24 H12 M0 14 V24"/><path d="M-8 -9 L8 -3 L-8 3 Z" fill="currentColor" stroke-width="2"/></g>
    <text x="188" y="164" class="sans" font-size="50" font-weight="700" fill="#f1f5f9">Drone Video Bridge</text>
    <text x="190" y="198" class="sans" font-size="19" fill="#94a3b8">Live drone camera feed on HDMI, straight from the remote</text>
    <rect x="190" y="214" width="131.9" height="26" rx="13" fill="#fb7185" fill-opacity="0.12" stroke="#fb7185" stroke-opacity="0.55"/><g transform="translate(208 226)" fill="none" stroke="#fb7185" stroke-width="1.8" stroke-linecap="round"><rect x="-6" y="-2" width="12" height="9" rx="2" fill="#fb7185" fill-opacity="0.15"/><path d="M-3.5 -2 V-5 a3.5 3.5 0 0 1 7 0 V-2"/></g><text x="222" y="231.5" class="sans" font-size="13" font-weight="700" fill="#e2e8f0">Private project</text>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="url(#bar)"/>
  <rect x="0" y="316" width="260" height="4" fill="url(#shine)" class="bar-shine" opacity="0.7"/>
</svg>
