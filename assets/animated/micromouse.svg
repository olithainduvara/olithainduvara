<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="MicroMouse: Autonomous maze-solving robot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b111d"/><stop offset="1" stop-color="#0f1726"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#fff" fill-opacity="0.09"/>
    </pattern>
    <radialGradient id="glowR" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#f43f5e" stop-opacity="0.16"/><stop offset="1" stop-color="#f43f5e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeMaskGrad" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="320">
      <rect width="1280" height="320" fill="url(#fadeMaskGrad)"/>
    </mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
  .fade-in{animation:fadeIn 1s ease-out both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes shimmer{from{transform:translateX(-400px)}to{transform:translateX(1700px)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

      .bar-shine{animation:shimmer 5s ease-in-out infinite}
      .icon-pulse{animation:pulse 3s ease-in-out infinite}
      .solve{stroke-dasharray:618;stroke-dashoffset:618;animation:solve 7s linear infinite}
      @keyframes solve{0%{stroke-dashoffset:618}70%,90%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
      .mouse{offset-path:path('M916 270 L948 270 L948 238 L948 206 L916 206 L916 174 L916 142 L948 142 L948 174 L980 174 L980 142 L1012 142 L1044 142 L1076 142 L1076 174 L1076 206 L1044 206 L1012 206 L1012 174 L1044 174');offset-rotate:auto;animation:run 7s linear infinite}
      @keyframes run{0%{offset-distance:0%}70%,100%{offset-distance:100%}}
      .goal{animation:pulse 1.6s ease-in-out infinite}
    </style>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glowR)"/>

  <g mask="url(#fadeMask)">
    <path d="M900 30 H1156 V286 H900 Z M900 62 h32 M900 126 h32 M932 158 v32 M932 222 v32 M900 254 h32 M964 30 v32 M964 62 v32 M932 94 h32 M932 126 h32 M964 126 v32 M932 190 h32 M964 190 v32 M964 222 v32 M964 254 v32 M964 94 h32 M964 126 h32 M996 158 v32 M964 190 h32 M964 254 h32 M996 62 h32 M996 94 h32 M996 126 h32 M996 158 h32 M996 222 h32 M996 254 h32 M1028 62 h32 M1028 94 h32 M1028 126 h32 M1028 158 h32 M1060 158 v32 M1028 190 h32 M1028 222 h32 M1060 222 v32 M1060 62 h32 M1092 62 v32 M1092 94 v32 M1060 126 h32 M1092 126 v32 M1092 158 v32 M1092 190 v32 M1060 222 h32 M1092 254 v32 M1092 62 h32 M1092 126 h32 M1092 190 h32 M1124 222 v32 M1092 254 h32 M1124 94 h32 M1124 158 h32" fill="none" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M900 30 H1156 V286 H900 Z M900 62 h32 M900 126 h32 M932 158 v32 M932 222 v32 M900 254 h32 M964 30 v32 M964 62 v32 M932 94 h32 M932 126 h32 M964 126 v32 M932 190 h32 M964 190 v32 M964 222 v32 M964 254 v32 M964 94 h32 M964 126 h32 M996 158 v32 M964 190 h32 M964 254 h32 M996 62 h32 M996 94 h32 M996 126 h32 M996 158 h32 M996 222 h32 M996 254 h32 M1028 62 h32 M1028 94 h32 M1028 126 h32 M1028 158 h32 M1060 158 v32 M1028 190 h32 M1028 222 h32 M1060 222 v32 M1060 62 h32 M1092 62 v32 M1092 94 v32 M1060 126 h32 M1092 126 v32 M1092 158 v32 M1092 190 v32 M1060 222 h32 M1092 254 v32 M1092 62 h32 M1092 126 h32 M1092 190 h32 M1124 222 v32 M1092 254 h32 M1124 94 h32 M1124 158 h32" fill="none" stroke="#f43f5e" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1031" y="161" width="26" height="26" rx="4" fill="#fbbf24" fill-opacity="0.22" class="goal"/>
    <path d="M916 270 L948 270 L948 238 L948 206 L916 206 L916 174 L916 142 L948 142 L948 174 L980 174 L980 142 L1012 142 L1044 142 L1076 142 L1076 174 L1076 206 L1044 206 L1012 206 L1012 174 L1044 174" fill="none" stroke="#fbbf24" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0.3" filter="url(#soft)" class="solve"/>
    <path d="M916 270 L948 270 L948 238 L948 206 L916 206 L916 174 L916 142 L948 142 L948 174 L980 174 L980 142 L1012 142 L1044 142 L1076 142 L1076 174 L1076 206 L1044 206 L1012 206 L1012 174 L1044 174" fill="none" stroke="#fde047" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" class="solve"/>
    <g class="mouse"><circle r="8" fill="#e2e8f0"/><circle r="2.6" cx="4" fill="#0b111d"/></g>
  </g>

  <g class="fade-in">
    <rect x="60" y="112" width="100" height="100" rx="22" fill="#f43f5e" fill-opacity="0.10" stroke="#f43f5e" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="60" y="112" width="100" height="100" rx="22" fill="none" stroke="#f43f5e" stroke-width="2" class="icon-pulse" filter="url(#soft)"/>
    <g transform="translate(110 162)" fill="none" stroke="#f43f5e" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-26" y="-26" width="52" height="52" rx="6"/><path d="M-26 -6 H2 M12 -26 V12 M-10 12 H26" stroke-width="3"/><circle cx="-14" cy="18" r="5" fill="currentColor"/></g>
    <text x="188" y="164" class="sans" font-size="50" font-weight="700" fill="#f1f5f9">MicroMouse</text>
    <text x="190" y="198" class="sans" font-size="19" fill="#94a3b8">Autonomous maze-solving robot</text>
    <rect x="190" y="214" width="131.9" height="26" rx="13" fill="#f43f5e" fill-opacity="0.12" stroke="#f43f5e" stroke-opacity="0.55"/><g transform="translate(208 226)" fill="none" stroke="#f43f5e" stroke-width="1.8" stroke-linecap="round"><rect x="-6" y="-2" width="12" height="9" rx="2" fill="#f43f5e" fill-opacity="0.15"/><path d="M-3.5 -2 V-5 a3.5 3.5 0 0 1 7 0 V-2"/></g><text x="222" y="231.5" class="sans" font-size="13" font-weight="700" fill="#e2e8f0">Private project</text>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="url(#bar)"/>
  <rect x="0" y="316" width="260" height="4" fill="url(#shine)" class="bar-shine" opacity="0.7"/>
</svg>
