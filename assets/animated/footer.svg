<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 170" width="1280" height="170" role="img" aria-label="Let's build something that matters. Open to internships, research collaborations and embedded / IoT projects.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b111d"/><stop offset="1" stop-color="#0f1726"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#fff" fill-opacity="0.08"/></pattern>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#4a9eff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f1f5f9"/><stop offset="0.5" stop-color="#bfe9ff"/><stop offset="1" stop-color="#f1f5f9"/></linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#4a9eff" stop-opacity="0.2"/><stop offset="1" stop-color="#4a9eff" stop-opacity="0"/></radialGradient>
    <linearGradient id="tfade" gradientUnits="userSpaceOnUse" x1="980" y1="0" x2="1120" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <mask id="tmask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="170"><rect width="1280" height="170" fill="url(#tfade)"/></mask>
    <style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
  .fade-in{animation:fadeIn 1s ease-out both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes shimmer{from{transform:translateX(-400px)}to{transform:translateX(1700px)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

      .pulse-trace{stroke-dasharray:26 600;stroke-dashoffset:626;animation:trace 6s linear infinite}
      @keyframes trace{to{stroke-dashoffset:0}}
      .blob1{animation:drift 14s ease-in-out infinite alternate}
      .blob2{animation:drift 18s ease-in-out infinite alternate-reverse}
      @keyframes drift{from{transform:translate(0,0)}to{transform:translate(60px,30px)}}

      .bar-shine{animation:shimmer 5s ease-in-out infinite}
      .t1{animation:fadeIn 1s ease-out both}.t2{animation:fadeIn 1s ease-out .3s both}
    </style>
  </defs>
  <rect width="1280" height="170" fill="url(#bg)"/>
  <rect width="1280" height="170" fill="url(#dots)"/>
  <rect x="0" y="0" width="1280" height="5" fill="url(#bar)"/>
  <rect x="0" y="0" width="260" height="5" fill="url(#shine)" class="bar-shine" opacity="0.7"/>
  <ellipse cx="640" cy="90" rx="420" ry="120" fill="url(#b1)" class="blob1"/>
  <g mask="url(#tmask)"><path d="M1137 118 L1011 118 L1128 118 L995 118" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="2"/><path d="M1137 118 L1011 118 L1128 118 L995 118" fill="none" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:2.27s"/><circle cx="995" cy="118" r="4" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2"/><path d="M1131 96 L1077 96 L938 96" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="2"/><path d="M1131 96 L1077 96 L938 96" fill="none" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:4.13s"/><circle cx="938" cy="96" r="4" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2"/><path d="M952 74 L977 99 L1014 136" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="2"/><path d="M952 74 L977 99 L1014 136" fill="none" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:4.86s"/><circle cx="1014" cy="136" r="4" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2"/><path d="M1002 30 L1104 30 L1010 30 L952 16" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="2"/><path d="M1002 30 L1104 30 L1010 30 L952 16" fill="none" stroke="#22d3ee" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:0.73s"/><circle cx="952" cy="16" r="4" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="2"/><path d="M1196 52 L1139 52 L1087 16" fill="none" stroke="#4a9eff" stroke-opacity="0.16" stroke-width="2"/><path d="M1196 52 L1139 52 L1087 16" fill="none" stroke="#4a9eff" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:3.44s"/><circle cx="1087" cy="16" r="4" fill="none" stroke="#4a9eff" stroke-opacity="0.35" stroke-width="2"/><path d="M1175 52 L1054 52 L1023 21 L888 21" fill="none" stroke="#4a9eff" stroke-opacity="0.16" stroke-width="2"/><path d="M1175 52 L1054 52 L1023 21 L888 21" fill="none" stroke="#4a9eff" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:1.61s"/><circle cx="888" cy="21" r="4" fill="none" stroke="#4a9eff" stroke-opacity="0.35" stroke-width="2"/><path d="M1194 30 L1159 65 L1116 22" fill="none" stroke="#4a9eff" stroke-opacity="0.16" stroke-width="2"/><path d="M1194 30 L1159 65 L1116 22" fill="none" stroke="#4a9eff" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:5.20s"/><circle cx="1116" cy="22" r="4" fill="none" stroke="#4a9eff" stroke-opacity="0.35" stroke-width="2"/><path d="M956 118 L1021 118 L1065 74 L998 74" fill="none" stroke="#4a9eff" stroke-opacity="0.16" stroke-width="2"/><path d="M956 118 L1021 118 L1065 74 L998 74" fill="none" stroke="#4a9eff" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:1.33s"/><circle cx="998" cy="74" r="4" fill="none" stroke="#4a9eff" stroke-opacity="0.35" stroke-width="2"/><path d="M1038 74 L1091 74 L1112 53" fill="none" stroke="#a78bfa" stroke-opacity="0.16" stroke-width="2"/><path d="M1038 74 L1091 74 L1112 53" fill="none" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:4.68s"/><circle cx="1112" cy="53" r="4" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/><path d="M1119 96 L1063 40 L1011 40 L1063 92" fill="none" stroke="#a78bfa" stroke-opacity="0.16" stroke-width="2"/><path d="M1119 96 L1063 40 L1011 40 L1063 92" fill="none" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:5.74s"/><circle cx="1063" cy="92" r="4" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/><path d="M1186 74 L1150 38 L1077 38" fill="none" stroke="#a78bfa" stroke-opacity="0.16" stroke-width="2"/><path d="M1186 74 L1150 38 L1077 38" fill="none" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:5.68s"/><circle cx="1077" cy="38" r="4" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/><path d="M961 118 L864 118 L941 118" fill="none" stroke="#a78bfa" stroke-opacity="0.16" stroke-width="2"/><path d="M961 118 L864 118 L941 118" fill="none" stroke="#a78bfa" stroke-opacity="0.8" stroke-width="2.4" stroke-linecap="round" class="pulse-trace" style="animation-delay:3.67s"/><circle cx="941" cy="118" r="4" fill="none" stroke="#a78bfa" stroke-opacity="0.35" stroke-width="2"/></g>
  <text x="640" y="80" text-anchor="middle" class="sans t1" font-size="34" font-weight="700" fill="url(#title)">Let's build something that matters.</text>
  <text x="640" y="116" text-anchor="middle" class="sans t2" font-size="17" fill="#94a3b8">Open to internships, research collaborations and embedded / IoT projects</text>
</svg>
