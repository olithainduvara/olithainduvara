<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="EMG Recorder: Real-time 3-channel EMG acquisition · NI USB-6009">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b111d"/><stop offset="1" stop-color="#0f1726"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#fff" fill-opacity="0.09"/>
    </pattern>
    <radialGradient id="glowR" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeMaskGrad" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="320">
      <rect width="1280" height="320" fill="url(#fadeMaskGrad)"/>
    </mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
  .fade-in{animation:fadeIn 1s ease-out both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes shimmer{from{transform:translateX(-400px)}to{transform:translateX(1700px)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

      .bar-shine{animation:shimmer 5s ease-in-out infinite}
      .icon-pulse{animation:pulse 3s ease-in-out infinite}
      .emg0{animation:scroll 6s linear infinite}
      .emg1{animation:scroll 7s linear infinite}
      .emg2{animation:scroll 8s linear infinite}
      @keyframes scroll{to{transform:translateX(-640px)}}
    </style>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
