<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="FloodLink 1.0: Flood early-warning system for the Mahaweli River">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b111d"/><stop offset="1" stop-color="#0f1726"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#fff" fill-opacity="0.09"/>
    </pattern>
    <radialGradient id="glowR" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.16"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeMaskGrad" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="320">
      <rect width="1280" height="320" fill="url(#fadeMaskGrad)"/>
    </mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
  .fade-in{animation:fadeIn 1s ease-out both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes shimmer{from{transform:translateX(-400px)}to{transform:translateX(1700px)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

      .bar-shine{animation:shimmer 5s ease-in-out infinite}
      .icon-pulse{animation:pulse 3s ease-in-out infinite}
      .water{animation:rise 8s ease-in-out infinite}
      @keyframes rise{0%,100%{transform:translateY(40px)}50%{transform:translateY(-22px)}}
      .w1{animation:wv 5s linear infinite}.w2{animation:wv 3.6s linear infinite reverse}
      @keyframes wv{to{transform:translateX(-180px)}}
      .rw{animation:pulse 1.8s ease-out infinite}.r2{animation-delay:.3s}.r3{animation-delay:.6s}
    </style>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glowR)"/>

  <g mask="url(#fadeMask)">
    <line x1="700" x2="1250" y1="118" y2="118" stroke="#ef4444" stroke-width="1.3" stroke-dasharray="7 6" opacity="0.7"/><text x="1250" y="112" text-anchor="end" class="mono" font-size="11" fill="#ef4444">MAJOR</text><line x1="700" x2="1250" y1="150" y2="150" stroke="#fbbf24" stroke-width="1.3" stroke-dasharray="7 6" opacity="0.7"/><text x="1250" y="144" text-anchor="end" class="mono" font-size="11" fill="#fbbf24">MINOR</text><line x1="700" x2="1250" y1="182" y2="182" stroke="#c084fc" stroke-width="1.3" stroke-dasharray="7 6" opacity="0.7"/><text x="1250" y="176" text-anchor="end" class="mono" font-size="11" fill="#c084fc">ALERT</text>
    <g class="water">
      <path d="M600 214 q45.0 -10 90.0 0 t90.0 0 q45.0 -10 90.0 0 t90.0 0 q45.0 -10 90.0 0 t90.0 0 q45.0 -10 90.0 0 t90.0 0 q45.0 -10 90.0 0 t90.0 0 q45.0 -10 90.0 0 t90.0 0  V340 H600 Z" fill="#22d3ee" fill-opacity="0.22" class="w1"/>
      <path d="M600 224 q35.0 -8 70.0 0 t70.0 0 q35.0 -8 70.0 0 t70.0 0 q35.0 -8 70.0 0 t70.0 0 q35.0 -8 70.0 0 t70.0 0 q35.0 -8 70.0 0 t70.0 0 q35.0 -8 70.0 0 t70.0 0 q35.0 -8 70.0 0 t70.0 0  V340 H600 Z" fill="#0891b2" fill-opacity="0.45" class="w2"/>
    </g>
    <line x1="1080" y1="70" x2="1080" y2="300" stroke="#cbd5e1" stroke-width="4"/>
    <rect x="1064" y="52" width="32" height="28" rx="6" fill="#0f172a" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="1080" cy="66" r="3.5" fill="#22d3ee"/>
    <g fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round">
      <path class="rw r1" d="M1066 40 A20 20 0 0 1 1094 40"/>
      <path class="rw r2" d="M1058 30 A32 32 0 0 1 1102 30"/>
      <path class="rw r3" d="M1050 20 A44 44 0 0 1 1110 20"/>
    </g>
  </g>

  <g class="fade-in">
    <rect x="60" y="112" width="100" height="100" rx="22" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="60" y="112" width="100" height="100" rx="22" fill="none" stroke="#22d3ee" stroke-width="2" class="icon-pulse" filter="url(#soft)"/>
    <g transform="translate(110 162)" fill="none" stroke="#22d3ee" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M-14 -16 A20 20 0 0 1 14 -16 M-7 -8 A10 10 0 0 1 7 -8"/><circle cx="0" cy="-1" r="2" fill="currentColor"/><path d="M-30 14 q7.5 -8 15 0 t15 0 t15 0 t15 0 M-30 26 q7.5 -8 15 0 t15 0 t15 0 t15 0"/></g>
    <text x="188" y="164" class="sans" font-size="50" font-weight="700" fill="#f1f5f9">FloodLink 1.0</text>
    <text x="190" y="198" class="sans" font-size="19" fill="#94a3b8">Flood early-warning system for the Mahaweli River</text>
    <rect x="190" y="214" width="131.9" height="26" rx="13" fill="#22d3ee" fill-opacity="0.12" stroke="#22d3ee" stroke-opacity="0.55"/><g transform="translate(208 226)" fill="none" stroke="#22d3ee" stroke-width="1.8" stroke-linecap="round"><rect x="-6" y="-2" width="12" height="9" rx="2" fill="#22d3ee" fill-opacity="0.15"/><path d="M-3.5 -2 V-5 a3.5 3.5 0 0 1 7 0 V-2"/></g><text x="222" y="231.5" class="sans" font-size="13" font-weight="700" fill="#e2e8f0">Private project</text>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="url(#bar)"/>
  <rect x="0" y="316" width="260" height="4" fill="url(#shine)" class="bar-shine" opacity="0.7"/>
</svg>
