<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="FlyMe Ground Station: Android app for tracking an RC aircraft live">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b111d"/><stop offset="1" stop-color="#0f1726"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="1" fill="#fff" fill-opacity="0.09"/>
    </pattern>
    <radialGradient id="glowR" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.16"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fadeMaskGrad" gradientUnits="userSpaceOnUse" x1="640" y1="0" x2="860" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="1280" height="320">
      <rect width="1280" height="320" fill="url(#fadeMaskGrad)"/>
    </mask>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
  .sans{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
  .mono{font-family:Consolas,'SFMono-Regular',Menlo,'Courier New',monospace}
  .fade-in{animation:fadeIn 1s ease-out both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes shimmer{from{transform:translateX(-400px)}to{transform:translateX(1700px)}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion: reduce){*{animation:none!important}}

      .bar-shine{animation:shimmer 5s ease-in-out infinite}
      .icon-pulse{animation:pulse 3s ease-in-out infinite}
      .plane{offset-path:path('M1010 236 C 940 200, 960 120, 1040 110 S 1150 150, 1120 90');offset-rotate:auto;animation:fly 6s ease-in-out infinite alternate}
      @keyframes fly{from{offset-distance:0%}to{offset-distance:100%}}
      .blink{animation:pulse 1.2s ease-in-out infinite}
      .pill{animation:fadeIn 1s ease-out both}
    </style>
  </defs>
  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#dots)"/>
  <rect width="1280" height="320" fill="url(#glowR)"/>

  <g mask="url(#fadeMask)">
    <g transform="translate(0 0)">
      <rect x="930" y="24" width="240" height="280" rx="30" fill="#0b1220" stroke="#94a3b8" stroke-opacity="0.6" stroke-width="2.5"/>
      <rect x="944" y="40" width="212" height="248" rx="20" fill="#111a2b"/>
      <g fill="none" stroke="#a78bfa" stroke-opacity="0.25"><circle cx="1010" cy="236" r="50"/><circle cx="1010" cy="236" r="100"/><circle cx="1010" cy="236" r="150"/></g>
      <path d="M1010 236 C 940 200, 960 120, 1040 110 S 1150 150, 1120 90" fill="none" stroke="#22d3ee" stroke-width="2.6" stroke-dasharray="3 7" stroke-linecap="round"/>
      <circle cx="1010" cy="236" r="10" fill="#f0b847"/><text x="1010" y="240.5" text-anchor="middle" class="sans" font-size="11" font-weight="800" fill="#0b1220">H</text>
      <g class="plane"><path d="M0 -12 L7 9 L0 4 L-7 9 Z" fill="#f1f5f9" transform="rotate(90)"/></g>
      <rect x="958" y="54" width="92" height="22" rx="11" fill="#0b1220" stroke="#4cd787" stroke-opacity="0.6"/>
      <circle cx="972" cy="65" r="4" fill="#4cd787" class="blink"/>
      <text x="982" y="69.5" class="sans" font-size="11" font-weight="700" fill="#e2e8f0">LIVE</text>
    </g>
    <g class="sans" font-size="13" font-weight="600">
      <g class="pill" style="animation-delay:0.0s"><rect x="740" y="100" width="150" height="30" rx="15" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/><text x="815" y="120" text-anchor="middle" fill="#e9d5ff">Live map</text></g><g class="pill" style="animation-delay:0.6s"><rect x="740" y="146" width="150" height="30" rx="15" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/><text x="815" y="166" text-anchor="middle" fill="#e9d5ff">Voice alerts</text></g><g class="pill" style="animation-delay:1.2s"><rect x="740" y="192" width="150" height="30" rx="15" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.5"/><text x="815" y="212" text-anchor="middle" fill="#e9d5ff">Flight replay</text></g>
    </g>
  </g>

  <g class="fade-in">
    <rect x="60" y="112" width="100" height="100" rx="22" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="60" y="112" width="100" height="100" rx="22" fill="none" stroke="#a78bfa" stroke-width="2" class="icon-pulse" filter="url(#soft)"/>
    <g transform="translate(110 162)" fill="none" stroke="#a78bfa" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><rect x="-17" y="-28" width="34" height="56" rx="7"/><path d="M0 -12 a8 8 0 0 1 8 8 c0 7 -8 14 -8 14 s-8 -7 -8 -14 a8 8 0 0 1 8 -8 z" stroke-width="2.6"/><path d="M-5 21 H5"/></g>
    <text x="188" y="164" class="sans" font-size="50" font-weight="700" fill="#f1f5f9">FlyMe Ground Station</text>
    <text x="190" y="198" class="sans" font-size="19" fill="#94a3b8">Android app for tracking an RC aircraft live</text>
    <rect x="190" y="214" width="131.9" height="26" rx="13" fill="#a78bfa" fill-opacity="0.12" stroke="#a78bfa" stroke-opacity="0.55"/><g transform="translate(208 226)" fill="none" stroke="#a78bfa" stroke-width="1.8" stroke-linecap="round"><rect x="-6" y="-2" width="12" height="9" rx="2" fill="#a78bfa" fill-opacity="0.15"/><path d="M-3.5 -2 V-5 a3.5 3.5 0 0 1 7 0 V-2"/></g><text x="222" y="231.5" class="sans" font-size="13" font-weight="700" fill="#e2e8f0">Private project</text>
  </g>

  <rect x="0" y="316" width="1280" height="4" fill="url(#bar)"/>
  <rect x="0" y="316" width="260" height="4" fill="url(#shine)" class="bar-shine" opacity="0.7"/>
</svg>
